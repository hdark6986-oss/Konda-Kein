<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✦ Konda Kein ✦</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@700;900&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  html, body { height:100%; overflow:hidden; background:#070312; }

  .stage {
    position:relative; width:100%; height:100vh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:
      radial-gradient(ellipse at 20% 20%, rgba(120,60,220,.25), transparent 50%),
      radial-gradient(ellipse at 80% 75%, rgba(255,80,180,.18), transparent 50%),
      radial-gradient(ellipse at 50% 110%, rgba(40,140,255,.20), transparent 55%),
      #070312;
    animation: hue 14s linear infinite;
  }
  @keyframes hue { to { filter: hue-rotate(360deg); } }

  /* ---- floating orbs ---- */
  .orb {
    position:absolute; border-radius:50%; filter:blur(70px); opacity:.55;
    animation: drift 12s ease-in-out infinite alternate;
  }
  .o1 { width:320px; height:320px; background:#7c3aed; top:-80px; left:-60px; }
  .o2 { width:260px; height:260px; background:#ec4899; bottom:-70px; right:-40px; animation-delay:-4s; }
  .o3 { width:200px; height:200px; background:#3b82f6; top:40%; left:70%; animation-delay:-8s; }
  @keyframes drift { to { transform: translate(60px, 40px) scale(1.15); } }

  /* ---- twinkling stars ---- */
  .star {
    position:absolute; width:3px; height:3px; background:#fff;
    border-radius:50%; opacity:.8; animation: tw 3s ease-in-out infinite;
    box-shadow: 0 0 10px 2px rgba(255,255,255,.6);
  }
  @keyframes tw {
    0%,100% { opacity:.15; transform:scale(.7); }
    50%     { opacity:1;   transform:scale(1.3); }
  }

  /* ---- gold frame ---- */
  .frame {
    position:relative; padding: 70px 90px; text-align:center;
    border:1px solid rgba(255,215,130,.35);
    background: rgba(255,255,255,.03);
    backdrop-filter: blur(8px);
    border-radius: 24px;
    box-shadow: 0 0 60px rgba(160,90,255,.25), inset 0 0 40px rgba(255,255,255,.03);
  }
  .frame::before {
    content:""; position:absolute; inset:10px; border-radius:16px;
    border:1px dashed rgba(255,215,130,.25); pointer-events:none;
  }
  .corner { position:absolute; font-size:26px; color:rgba(255,215,130,.8); }
  .c1 { top:8px; left:14px; } .c2 { top:8px; right:14px; }
  .c3 { bottom:8px; left:14px; } .c4 { bottom:8px; right:14px; }

  /* ---- badge ---- */
  .badge {
    font-family:'Montserrat',sans-serif; font-size:11px; letter-spacing:6px;
    text-transform:uppercase; color:#f5c96b; margin-bottom:26px;
    opacity:0; animation: rise 1s ease .4s forwards;
  }

  /* ---- name reveal ---- */
  .name {
    font-family:'Playfair Display',serif; font-weight:900;
    font-size: clamp(3rem, 11vw, 8rem); line-height:1.05; white-space:nowrap;
  }
  .name .ch {
    display:inline-block;
    background: linear-gradient(120deg, #ffe9a8, #ffb86b, #ff7ad9, #a78bfa, #7dd3fc, #ffe9a8);
    background-size: 300% auto;
    -webkit-background-clip:text; background-clip:text; color:transparent;
    animation: shine 5s linear infinite, pop .8s cubic-bezier(.2,1.4,.4,1) both;
    text-shadow: 0 0 45px rgba(255,170,90,.25);
  }
  .name .space { display:inline-block; width:.35em; }
  @keyframes shine { to { background-position: 300% center; } }
  @keyframes pop { from { opacity:0; transform: translateY(60px) scale(.6) rotate(-6deg); } }

  .sub {
    font-family:'Great Vibes',cursive; font-size: clamp(1.4rem, 4vw, 2.6rem);
    color:#e9d8ff; margin-top:22px; opacity:0; animation: rise 1.2s ease 1.6s forwards;
  }
  .rule {
    width:0; height:1px; margin:26px auto 0;
    background: linear-gradient(90deg, transparent, #f5c96b, transparent);
    animation: grow 1.2s ease 1.2s forwards;
  }
  @keyframes rise { from { opacity:0; transform:translateY(24px);} to { opacity:1; transform:none;} }
  @keyframes grow { to { width:70%; } }

  /* ---- falling sparkles ---- */
  .spark { position:absolute; top:-10px; font-size:14px; animation: fall linear infinite; opacity:.9; }
  @keyframes fall { to { transform: translateY(110vh) rotate(360deg); } }

  .footer {
    position:absolute; bottom:22px; width:100%; text-align:center;
    font-family:'Montserrat',sans-serif; font-size:10px; letter-spacing:4px;
    color:rgba(255,255,255,.35); text-transform:uppercase;
  }
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>

  <div class="frame">
    <span class="corner c1">✦</span><span class="corner c2">✦</span>
    <span class="corner c3">✦</span><span class="corner c4">✦</span>

    <div class="badge">✨ A Name To Remember ✨</div>
    <h1 class="name" id="name"></h1>
    <div class="rule"></div>
    <p class="sub">where elegance meets brilliance</p>
  </div>

  <div class="footer">made with ✦ just for you</div>
</div>

<script>
  // letter-by-letter reveal
  const text = "KONDA KEIN";
  const h1 = document.getElementById('name');
  [...text].forEach((c, i) => {
    const s = document.createElement('span');
    s.className = c === ' ' ? 'space' : 'ch';
    s.textContent = c === ' ' ? '' : c;
    s.style.animationDelay = (0.6 + i * 0.09) + 's';
    h1.appendChild(s);
  });

  // twinkling stars
  const stage = document.getElementById('stage');
  for (let i = 0; i < 60; i++) {
    const st = document.createElement('div');
    st.className = 'star';
    st.style.left = Math.random() * 100 + '%';
    st.style.top = Math.random() * 100 + '%';
    const sz = 1 + Math.random() * 2.5;
    st.style.width = st.style.height = sz + 'px';
    st.style.animationDelay = (Math.random() * 3) + 's';
    st.style.animationDuration = (2 + Math.random() * 3) + 's';
    stage.appendChild(st);
  }

  // falling sparkles
  const icons = ['✦','✧','❋','⋆','✩'];
  const colors = ['#ffd166','#ff7ad9','#a78bfa','#7dd3fc','#ffffff'];
  for (let i = 0; i < 18; i++) {
    const sp = document.createElement('div');
    sp.className = 'spark';
    sp.textContent = icons[Math.floor(Math.random() * icons.length)];
    sp.style.left = Math.random() * 100 + '%';
    sp.style.color = colors[Math.floor(Math.random() * colors.length)];
    sp.style.animationDuration = (6 + Math.random() * 8) + 's';
    sp.style.animationDelay = (Math.random() * 8) + 's';
    sp.style.fontSize = (8 + Math.random() * 12) + 'px';
    stage.appendChild(sp);
  }
</script>
</body>
</html>
